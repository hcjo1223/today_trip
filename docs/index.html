    function updateNavStyles() {
      const tabs = ["home", "places", "tours", "cards", "admin"];
      tabs.forEach((t) => {
        const dBtn = document.getElementById("nav-" + t);
        const mBtn = document.getElementById("mnav-" + t);
        const active = state.activeTab === t;
        if (dBtn) {
          dBtn.className = active
            ? "px-3.5 py-2 rounded-lg text-sm font-semibold bg-[#0F4C3A] text-white"
            : "px-3.5 py-2 rounded-lg text-sm font-medium text-stone-600 hover:bg-stone-200/60";
        }
        if (mBtn) {
          mBtn.className = active
            ? "flex flex-col items-center justify-center gap-0.5 text-xs font-bold text-[#0F4C3A]"
            : "flex flex-col items-center justify-center gap-0.5 text-xs font-medium text-stone-500";
        }
      });
      const userEl = document.getElementById("header-user-name");
      if (userEl) userEl.textContent = state.currentUser.nickname;
    }

    function switchTab(tab) {
      state.activeTab = tab;
      updateNavStyles();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(html) {
      const backdrop = document.getElementById("modal-backdrop");
      const content = document.getElementById("modal-content");
      content.innerHTML = html;
      backdrop.classList.remove("hidden");
      backdrop.classList.add("flex");
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      backdrop.classList.add("hidden");
      backdrop.classList.remove("flex");
    }

    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });

    function togglePlaceLike(placeUid, event) {
      if (event) event.stopPropagation();
      const p = state.places.find((x) => x.placeUid === placeUid);
      if (!p) return;
      p.likedByMe = !p.likedByMe;
      p.likeCnt += p.likedByMe ? 1 : -1;
      render();
    }

    function submitPlaceReview(e, placeUid) {
      e.preventDefault();
      const rate = Number(document.getElementById("rv-rate").value || 5);
      const content = document.getElementById("rv-content").value.trim();
      if (!content) return;
      const p = state.places.find((x) => x.placeUid === placeUid);
      if (!p) return;
      p.reviews.unshift({
        rvUid: Date.now(),
        nickname: state.currentUser.nickname,
        rate,
        writeDate: "2026-11-12",
        content
      });
      openPlaceDetail(placeUid);
      render();
    }

      const u = state.users.find((x) => x.usUid === usUid);

      state.currentUser = u;
      updateNavStyles();
      render();
    }

    function renderHome() {
      const topPlaces = state.places.slice(0, 4);
      const topTours = state.tours.slice(0, 3);
      const topPics = state.pictures.slice(0, 3);

      return `
        <div class="space-y-10">
          <!-- Hero -->
          <section class="relative rounded-3xl overflow-hidden bg-stone-900 text-white shadow-lg">
            <img src="${IMG_BASE}/images/jeju.jpg" alt="제주 성산일출봉" class="w-full h-72 md:h-96 object-cover opacity-75" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/35 to-transparent flex flex-col justify-end p-6 md:p-10">
              <span class="inline-block w-fit px-3 py-1 rounded-full text-xs font-semibold bg-[#D96B43] text-white mb-3">
                오늘의 큐레이션 · 대한민국 사계절 여행기
              </span>
              <h1 class="text-2xl md:text-4xl font-bold tracking-tight leading-tight">
                설레는 오늘의 여행,<br/>나만의 동선과 사진으로 기록하세요
              </h1>
              <p class="text-xs md:text-sm text-stone-200 mt-2 max-w-xl">
                한국관광공사 TourAPI 기반 명소 탐색부터 일차별 여행 코스 빌더, 포토 커뮤니티까지 TypeScript + Next.js 16 아키텍처로 새롭게 태어났습니다.
              </p>
              <div class="flex flex-wrap gap-2.5 mt-5">
                <button onclick="switchTab('places')" class="px-4 py-2.5 rounded-xl bg-white text-stone-900 font-bold text-xs md:text-sm shadow-sm">
                  📍 전국 명소 탐색하기
                </button>
                <button onclick="openNewTourModal()" class="px-4 py-2.5 rounded-xl bg-[#0F4C3A] text-white font-bold text-xs md:text-sm shadow-sm">
                  + 나만의 여행 일정 만들기
                </button>
              </div>
            </div>
          </section>

          <!-- Featured Tours -->
          <section class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-lg md:text-xl font-bold text-stone-900">에디터 추천 여행 코스</h2>
                <p class="text-xs text-stone-500">일자별 동선과 현지 팁이 담긴 검증된 여행 일정</p>
              </div>
              <button onclick="switchTab('tours')" class="text-xs font-semibold text-[#0F4C3A] hover:underline">전체보기 →</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${topTours.map((t) => `
                <article onclick="openTourDetail(${t.tuUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200/90 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col">
                  <div class="relative h-44">
                    <img src="${t.coverImage}" alt="${t.title}" class="w-full h-full object-cover" />
                    <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-black/65 text-white">
                      ${AREA_MAP[t.location] || "전국"} · ${t.period - 1}박 ${t.period}일
                    </span>
                  </div>
                  <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <div>
                      <h3 class="font-bold text-sm text-stone-900 line-clamp-2">${t.title}</h3>
                      <p class="text-xs text-stone-500 mt-1 line-clamp-2">${t.summary}</p>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-stone-500 pt-2 border-t border-stone-100">
                      <span>✍️ ${t.nickname}</span>
                      <span>♥ ${t.likeCnt} · 조회 ${t.hits}</span>
                    </div>
                  </div>
                </article>
              `).join("")}
            </div>
          </section>

          <!-- Popular Places -->
          <section class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-lg md:text-xl font-bold text-stone-900">인기 여행지 & 미식 공간</h2>
                <p class="text-xs text-stone-500">관광지 · 감성 숙소 · 로컬 맛집 큐레이션</p>
              </div>
              <button onclick="switchTab('places')" class="text-xs font-semibold text-[#0F4C3A] hover:underline">더보기 →</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${topPlaces.map((p) => `
                <div onclick="openPlaceDetail(${p.placeUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200/90 overflow-hidden shadow-xs hover:shadow-md transition">
                  <div class="relative h-36">
                    <img src="${p.firstImage2}" alt="${p.title}" class="w-full h-full object-cover" />
                    <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md text-[10px] font-semibold bg-[#0F4C3A] text-white">
                      ${TYPE_MAP[p.contentTypeId]}
                    </span>
                  </div>
                  <div class="p-3.5 space-y-1.5">
                    <h3 class="font-bold text-sm text-stone-900 truncate">${p.title}</h3>
                    <p class="text-xs text-stone-500 truncate">${p.addr1}</p>
                    <div class="flex items-center justify-between text-xs pt-1">
                      <span class="text-amber-600 font-semibold">★ ${p.rateAvg} (${p.reviews.length})</span>
                      <span class="text-rose-600 font-semibold">♥ ${p.likeCnt}</span>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>

          <!-- Photo Stories -->
          <section class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-lg md:text-xl font-bold text-stone-900">여행사진 커뮤니티</h2>
                <p class="text-xs text-stone-500">여행자들이 직접 기록한 계절의 조각</p>
              </div>
              <button onclick="switchTab('cards')" class="text-xs font-semibold text-[#0F4C3A] hover:underline">전체 사진 →</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${topPics.map((pic) => `
                <div onclick="openPicDetail(${pic.pcUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200/90 overflow-hidden shadow-xs hover:shadow-md transition">
                  <img src="${pic.image}" alt="${pic.title}" class="w-full h-44 object-cover" />
                  <div class="p-4 space-y-1.5">
                    <div class="text-[11px] font-semibold text-[#0F4C3A]">${AREA_MAP[pic.location]} · ${FOCUS_MAP[pic.focus]}</div>
                    <h3 class="font-bold text-sm text-stone-900">${pic.title}</h3>
                    <p class="text-xs text-stone-600 line-clamp-2">${pic.contents}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderPlaces() {
      const filtered = state.places.filter((p) => {
        if (state.placeTypeFilter && p.contentTypeId !== state.placeTypeFilter) return false;
        if (state.placeAreaFilter && p.areaCode !== state.placeAreaFilter) return false;
        if (state.placeKeyword && !p.title.includes(state.placeKeyword) && !p.addr1.includes(state.placeKeyword)) return false;
        return true;
      });

      return `
        <div class="space-y-5">
          <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="text-lg font-bold text-stone-900">전국 여행 장소 탐색 (${filtered.length})</h2>
              <div class="flex gap-1.5">
                ${[
                  { id: 0, label: "전체" },
                  { id: 12, label: "🏞️ 관광지" },
                  { id: 32, label: "🏡 감성숙소" },
                  { id: 39, label: "🍲 맛집·카페" }
                ].map((tab) => `
                  <button onclick="state.placeTypeFilter=${tab.id}; render()" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.placeTypeFilter === tab.id ? "bg-[#0F4C3A] text-white" : "bg-stone-100 text-stone-700"}">
                    ${tab.label}
                  </button>
                `).join("")}
              </div>
            </div>
            <div class="flex gap-2">
              <select onchange="state.placeAreaFilter=Number(this.value); render()" class="border border-stone-300 rounded-xl px-3 py-2 text-xs bg-white">
                <option value="0" ${state.placeAreaFilter === 0 ? "selected" : ""}>전체 지역</option>
                <option value="1" ${state.placeAreaFilter === 1 ? "selected" : ""}>서울</option>
                <option value="6" ${state.placeAreaFilter === 6 ? "selected" : ""}>부산</option>
                <option value="10" ${state.placeAreaFilter === 10 ? "selected" : ""}>강원</option>
                <option value="13" ${state.placeAreaFilter === 13 ? "selected" : ""}>경북(경주)</option>
                <option value="17" ${state.placeAreaFilter === 17 ? "selected" : ""}>제주</option>
              </select>
              <input
                value="${state.placeKeyword}"
                oninput="state.placeKeyword=this.value; render()"
                placeholder="장소명 또는 지역 검색 (예: 제주, 경복궁, 한옥)..."
                class="flex-1 border border-stone-300 rounded-xl px-3.5 py-2 text-xs"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${filtered.map((p) => `
              <div onclick="openPlaceDetail(${p.placeUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col">
                <div class="relative h-44">
                  <img src="${p.firstImage2}" alt="${p.title}" class="w-full h-full object-cover" />
                  <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-semibold bg-[#0F4C3A] text-white">
                    ${TYPE_MAP[p.contentTypeId]} · ${AREA_MAP[p.areaCode]}
                  </span>
                  <button onclick="togglePlaceLike(${p.placeUid}, event)" class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-xs font-bold ${p.likedByMe ? "bg-rose-600 text-white" : "bg-white/90 text-stone-800"}">
                    ♥ ${p.likeCnt}
                  </button>
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                  <div>
                    <h3 class="font-bold text-base text-stone-900">${p.title}</h3>
                    <p class="text-xs text-stone-500 mt-0.5">${p.addr1}</p>
                    <p class="text-xs text-stone-600 mt-2 line-clamp-2">${p.overview}</p>
                  </div>
                  <div class="flex items-center justify-between text-xs pt-2 border-t border-stone-100">
                    <span class="text-amber-600 font-semibold">★ ${p.rateAvg} · 리뷰 ${p.reviews.length}개</span>
                    <span class="text-stone-400">조회 ${p.viewCnt}</span>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderTours() {
      return `
        <div class="space-y-5">
          <div class="bg-white p-4 rounded-2xl border border-stone-200 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg font-bold text-stone-900">여행 일정 코스 (${state.tours.length})</h2>
              <p class="text-xs text-stone-500">카드를 탭하면 일차별 방문 장소와 상세 메모를 확인할 수 있습니다.</p>
            </div>
            <button onclick="openNewTourModal()" class="px-4 py-2.5 rounded-xl bg-[#0F4C3A] text-white text-xs font-bold shadow-xs">
              + 새 여행 일정 만들기
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${state.tours.map((t) => `
              <div onclick="openTourDetail(${t.tuUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col">
                <div class="relative h-48">
                  <img src="${t.coverImage}" alt="${t.title}" class="w-full h-full object-cover" />
                  <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-semibold bg-[#0F4C3A] text-white">
                    ${AREA_MAP[t.location] || "전국"} · ${t.period - 1}박 ${t.period}일
                  </span>
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                  <div>
                    <div class="flex flex-wrap gap-1 mb-2">
                      ${t.tags.map((tag) => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-stone-100 text-stone-600">#${tag}</span>`).join("")}
                    </div>
                    <h3 class="font-bold text-base text-stone-900">${t.title}</h3>
                    <p class="text-xs text-stone-600 mt-1 line-clamp-2">${t.summary}</p>
                  </div>
                  <div class="space-y-1.5 pt-2 border-t border-stone-100 text-xs text-stone-500">
                    <div class="font-semibold text-stone-800">총 ${t.days.length}개 일차 코스 포함</div>
                    <div class="flex justify-between">
                      <span>✍️ ${t.nickname}</span>
                      <span>♥ ${t.likeCnt} · 조회 ${t.hits}</span>
                    </div>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderCards() {
      return `
        <div class="space-y-5">
          <div class="bg-white p-4 rounded-2xl border border-stone-200 flex items-center justify-between">
            <div>
              <h2 class="text-lg font-bold text-stone-900">여행사진 커뮤니티 (${state.pictures.length})</h2>
              <p class="text-xs text-stone-500">사진을 탭하여 촬영 스토리와 댓글을 확인해 보세요.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${state.pictures.map((pic) => `
              <div onclick="openPicDetail(${pic.pcUid})" class="cursor-pointer bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs hover:shadow-md transition">
                <div class="relative h-52">
                  <img src="${pic.image}" alt="${pic.title}" class="w-full h-full object-cover" />
                  <span class="absolute bottom-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-black/65 text-white">
                    ${AREA_MAP[pic.location]} · ${FOCUS_MAP[pic.focus]}
                  </span>
                </div>
                <div class="p-4 space-y-2">
                  <h3 class="font-bold text-sm text-stone-900">${pic.title}</h3>
                  <p class="text-xs text-stone-600 line-clamp-2">${pic.contents}</p>
                  <div class="flex items-center justify-between text-xs text-stone-500 pt-2 border-t border-stone-100">
                    <span>📸 ${pic.nickname}</span>
                    <span>♥ ${pic.likeCnt} · 💬 ${pic.comments.length}</span>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      return `
        <div class="space-y-6">
          <!-- Account Switcher -->
          <div class="bg-white p-5 rounded-2xl border border-stone-200 space-y-3">
            <h2 class="text-base font-bold text-stone-900">원클릭 데모 계정 전환 (현재: ${state.currentUser.nickname})</h2>
            <p class="text-xs text-stone-500">계정을 전환한 뒤 장소 리뷰나 여행 일정을 작성하면 해당 작성자 이름으로 즉시 기록됩니다.</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              ${state.users.map((u) => `
                <button onclick="switchDemoUser(${u.usUid})" class="p-3 rounded-xl border text-left transition ${state.currentUser.usUid === u.usUid ? "border-[#0F4C3A] bg-[#0F4C3A]/5" : "border-stone-200 hover:border-stone-400"}">
                  <div class="flex items-center justify-between">
                    <span class="font-bold text-xs text-stone-900">${u.nickname}</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full ${u.role === "ADMIN" ? "bg-emerald-100 text-emerald-800" : "bg-stone-100 text-stone-600"}">${u.role}</span>
                  </div>
                  <p class="text-[11px] text-stone-500 mt-1 truncate">${u.memo}</p>
                </button>
              `).join("")}
            </div>
          </div>

          <!-- KPI Cards -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-stone-200">
              <span class="text-xs text-stone-500">등록된 명소·맛집</span>
              <p class="text-2xl font-bold text-stone-900 mt-1 font-mono">${state.places.length}</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-stone-200">
              <span class="text-xs text-stone-500">여행 일정 코스</span>
              <p class="text-2xl font-bold text-[#0F4C3A] mt-1 font-mono">${state.tours.length}</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-stone-200">
              <span class="text-xs text-stone-500">포토 스토리</span>
              <p class="text-2xl font-bold text-stone-900 mt-1 font-mono">${state.pictures.length}</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-stone-200">
              <span class="text-xs text-stone-500">활동 회원수</span>
              <p class="text-2xl font-bold text-stone-900 mt-1 font-mono">${state.users.length}</p>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app-root");
      if (state.activeTab === "home") root.innerHTML = renderHome();
      else if (state.activeTab === "places") root.innerHTML = renderPlaces();
      else if (state.activeTab === "tours") root.innerHTML = renderTours();
      else if (state.activeTab === "cards") root.innerHTML = renderCards();
      else if (state.activeTab === "admin") root.innerHTML = renderAdmin();
    }

    updateNavStyles();
    render();
  </script>
</body>
</html>
